syntax = "proto3";

package exchange.v1;

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

message SubmitOrderRequest {
  uint32 security_id = 1;
  OrderType type = 2;
  Side side = 3;
  uint64 quantity = 4;
  optional uint64 price = 5;
  optional TimeInForce tif = 6;
}

message SingleOrderRequest {
  string order_id = 1; // UUID
}

message AmendOrderRequest {
  string order_id = 1; // UUID
  optional uint64 new_price = 2;
  optional uint64 new_quantity = 3;
}

message OrderAck {
  string order_id = 1; // UUID
}
