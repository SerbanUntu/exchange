syntax = "proto3";

import "google/protobuf/empty.proto";
import "orders.proto";
import "market_data.proto";
import "securities.proto";

package exchange.v1;

service Gateway {
  rpc SubmitOrder (SubmitOrderRequest) returns (OrderAck);
  rpc CancelOrder (SingleOrderRequest) returns (OrderAck);
  rpc AmendOrder (AmendOrderRequest) returns (OrderAck);

  rpc GetCandleData (CandleDataRequest) returns (CandleDataResponse);
  rpc GetL1Data (OrderBookDataRequest) returns (L1DataResponse);
  rpc GetL2Data (L2DataRequest) returns (L2DataResponse);
  rpc GetL3Data (OrderBookDataRequest) returns (stream OrderBookUpdate);
  rpc GetOrderData (SingleOrderRequest) returns (OrderDataResponse);
  rpc GetExecutionData (ExecutionDataRequest) returns (ExecutionDataResponse);

  rpc ListSecurities (google.protobuf.Empty) returns (ListSecuritiesResponse);
  rpc GetSecurityById (GetSecurityByIdRequest) returns (Security);
  rpc GetSecurityBySymbol (GetSecurityBySymbolRequest) returns (Security);
}
