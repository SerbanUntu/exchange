syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

package exchange;

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_RESTING = 1;
  ORDER_STATUS_FINISHED = 2;
}

message SubmitOrderRequest {
  uint32 security_id = 1;
  OrderType type = 2;
  Side side = 3;
  uint64 quantity = 4;
  optional uint64 price = 5; // In cents, required for limit orders. All prices are in EUROs
  optional TimeInForce tif = 6; // Required for limit orders
}

message SingleOrderRequest {
  uint64 order_id = 1;
}

message BookOrder {
  uint64 price = 1;
  uint64 quantity = 2;
  optional uint64 order_id = 3; // Only in L3 order book data
}

message Trade {
  uint64 price = 1;
  uint64 quantity = 2;
  google.protobuf.Timestamp execution_time = 3;
}

message OrderResponse {// Also used as an update
  uint64 order_id = 1;
  OrderStatus order_status = 2;
  uint64 filled_quantity = 3;
  uint64 remaining_quantity = 4;
  uint64 cancelled_quantity = 5;
  optional Trade most_recent_fill = 6; // Contains the fill that caused a new message to be sent
}

message CandleDataRequest {
  uint32 security_id = 1;
  uint32 resolution_minutes = 2; // Base is 1 minute. A resolution of 10 means 10 minutes per candle.
  optional google.protobuf.Timestamp start_time = 3;
  optional google.protobuf.Timestamp end_time = 4;
}

message Candle {
  google.protobuf.Timestamp start_time = 1; // Inclusive
  google.protobuf.Timestamp end_time = 2; // Exclusive
  uint64 opening_price = 3;
  uint64 closing_price = 4;
  uint64 high_price = 5;
  uint64 low_price = 6;
  uint64 total_quantity = 7;
}

message CandleDataResponse {
  repeated Candle candles = 1;
}

enum MarketDataLevel {
  MARKET_DATA_LEVEL_UNSPECIFIED = 0;
  MARKET_DATA_LEVEL_L1 = 1;
  MARKET_DATA_LEVEL_L2 = 2;
  MARKET_DATA_LEVEL_L3 = 3;
}

message OrderBookDataRequest {
  uint32 security_id = 1;
  MarketDataLevel level = 2;
}

message OrderBookDataResponse {
  repeated BookOrder bids = 1;
  repeated BookOrder asks = 2;
}

message CancelOrderRequest {
  uint64 order_id = 1;
}

enum CancelResult {
  CANCEL_RESULT_UNSPECIFIED = 0;
  CANCEL_RESULT_ALREADY_FILLED = 1;
  CANCEL_RESULT_PARTIALLY_CANCELLED = 2;
  CANCEL_RESULT_FULLY_CANCELLED = 3;
} // Others such as invalid ID handled via standard gRPC responses

message CancelOrderResponse {
  CancelResult cancel_result = 1;
}

message AmendOrderRequest {
  uint64 order_id = 1;
  optional uint64 new_price = 2;
  optional uint64 new_quantity = 3;
}

enum AmendResult {
  AMEND_RESULT_UNSPECIFIED = 0;
  AMEND_RESULT_QUANTITY_ALREADY_FILLED = 1; // New quantity is at or below filled quantity
  AMEND_RESULT_AMENDED_POSITION_UNCHANGED = 2; // For quantity decreases
  AMEND_RESULT_AMENDED_POSITION_RESET = 3;
}

message AmendOrderResponse {
  AmendResult amend_result = 1;
  uint64 new_price = 2;
  uint64 new_quantity = 3;
} // Bad request for non-GTC

message ExecutionDataRequest {
  optional uint32 security_id = 1; // All are constraints
  optional uint64 order_id = 2;
  optional google.protobuf.Timestamp start_time = 3;
  optional google.protobuf.Timestamp end_time = 4;
}

message Execution {
  uint64 order_id = 1;
  repeated Trade fill_result = 2;
}

message ExecutionDataResponse {
  repeated Execution executions = 1;
}

message Security {
  uint32 security_id = 1;
  string symbol = 2;
  string name = 3;
  string description = 4;
} // Lot size is 1 share. Tick size is 1 cent. Currency is Euros.

message ListSecuritiesResponse {
  repeated Security securities = 1;
}

message GetSecurityByIdRequest {
  uint32 security_id = 1;
}

message GetSecurityBySymbolRequest {
  string symbol = 1;
}

service Gateway {
  rpc SubmitOrder (SubmitOrderRequest) returns (stream OrderResponse);
  rpc GetOrder (SingleOrderRequest) returns (OrderResponse);
  rpc WatchOrder (SingleOrderRequest) returns (stream OrderResponse);
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
  rpc AmendOrder (AmendOrderRequest) returns (AmendOrderResponse);

  rpc GetCandleData (CandleDataRequest) returns (CandleDataResponse);
  rpc GetOrderBookData (OrderBookDataRequest) returns (OrderBookDataResponse);
  rpc GetExecutionData (ExecutionDataRequest) returns (ExecutionDataResponse);

  rpc ListSecurities (google.protobuf.Empty) returns (ListSecuritiesResponse);
  rpc GetSecurityById (GetSecurityByIdRequest) returns (Security);
  rpc GetSecurityBySymbol (GetSecurityBySymbolRequest) returns (Security);
}
