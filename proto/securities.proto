syntax = "proto3";

package exchange.v1;

message Security {
  uint32 security_id = 1;
  string symbol = 2;
  string name = 3;
  string description = 4;
}

message ListSecuritiesResponse {
  repeated Security securities = 1;
}

message GetSecurityByIdRequest {
  uint32 security_id = 1;
}

message GetSecurityBySymbolRequest {
  string symbol = 1;
}
