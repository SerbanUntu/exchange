name: build

on: [ push ]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang formatter
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find client common server -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: pip install conan

      - name: Detect profile
        run: conan profile detect --force

      - name: Audit dependencies
        continue-on-error: true
        env:
          CONAN_AUDIT_TOKEN: ${{ secrets.CONAN_AUDIT_TOKEN }}
        run: |
          conan audit provider auth conancenter --token="$CONAN_AUDIT_TOKEN"
          conan audit scan .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang linter
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Build
        uses: ./.github/actions/build
        with:
          cc: gcc
          cxx: g++
          opt: 3

      - name: Lint
        run: |
          find client common server -type f -name '*.cpp' -not -path '*/test/*' -print0 \
            | xargs -0 --no-run-if-empty clang-tidy -p cmake-build-release/build/Release

  test:
    name: ${{ matrix.compiler }} -O${{ matrix.opt }}${{ matrix.sanitizers && format(' {0}', matrix.sanitizers) || '' }}
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tsan.supp
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]
        opt: [ 0, 3 ]
        sanitizers: [ '', 'address,undefined', thread ]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 runners use more Address Space Layout Randomization than the sanitizer runtimes support
      - name: Reduce ASLR randomness
        if: matrix.sanitizers != '' && !env.ACT
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build
        uses: ./.github/actions/build
        with:
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          opt: ${{ matrix.opt }}
          sanitizers: ${{ matrix.sanitizers }}

      - name: Test
        run: ctest --test-dir cmake-build-release/build/Release --output-on-failure

  mutations:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Reduce ASLR randomness
        if: hashFiles('mutation_testing/patches/*.patch') != '' && !env.ACT
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Install dependencies
        if: hashFiles('mutation_testing/patches/*.patch') != ''
        uses: ./.github/actions/build
        with:
          cc: gcc
          cxx: g++
          build: 'false'

      - name: Run mutations
        if: hashFiles('mutation_testing/patches/*.patch') != ''
        run: ./mutation_testing/run_all_mutations.sh

      - name: Upload results
        if: ${{ !cancelled() && hashFiles('mutation_testing/build/MUTATION_TESTING_RESULTS.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-results
          path: mutation_testing/build/MUTATION_TESTING_RESULTS.md

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-logs
          path: mutation_testing/build/logs/

  fuzz:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Reduce ASLR randomness
        if: ${{ !env.ACT }}
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build
        uses: ./.github/actions/build
        with:
          cc: clang
          cxx: clang++
          opt: 1
          sanitizers: address,undefined
          fuzz: 'true'

      - name: Fuzz
        run: |
          mkdir -p fuzzing-output-seeds fuzzing-artifacts
          cmake-build-release/build/Release/server/matching_engine/fuzzing/exchange-server-matching-engine-fuzzer \
            -max_total_time=600 -artifact_prefix=fuzzing-artifacts/ \
            fuzzing-output-seeds server/matching_engine/fuzzing/seeds

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-artifacts
          path: fuzzing-artifacts

  fuzz-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr and llvm-cov
        run: |
          pip install gcovr
          sudo apt-get update && sudo apt-get install -y llvm

      - name: Build
        uses: ./.github/actions/build
        with:
          cc: clang
          cxx: clang++
          opt: 0
          coverage: 'true'
          fuzz: 'true'

      - name: Reset coverage counters
        run: find cmake-build-release -name '*.gcda' -delete

      - name: Fuzz
        run: |
          mkdir -p fuzzing-output-seeds
          cmake-build-release/build/Release/server/matching_engine/fuzzing/exchange-server-matching-engine-fuzzer \
            -max_total_time=60 fuzzing-output-seeds server/matching_engine/fuzzing/seeds

      - name: Generate coverage report
        run: >
          gcovr --gcov-executable "llvm-cov gcov"
          --filter server/matching_engine/ --filter server/common/src/collections/orderbook/
          --exclude '.*/test/.*' --exclude '.*/fuzzing/.*'
          --fail-under-line 0 --fail-under-branch 0
          --cobertura fuzz-coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ !env.ACT && !cancelled() && hashFiles('fuzz-coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: fuzz-coverage.xml
          flags: fuzzing
          fail_ci_if_error: true

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pip install gcovr

      - name: Build
        uses: ./.github/actions/build
        with:
          cc: gcc
          cxx: g++
          opt: 0
          coverage: 'true'

      - name: Reset coverage counters
        run: find cmake-build-release -name '*.gcda' -delete

      - name: Test
        run: ctest --test-dir cmake-build-release/build/Release --output-on-failure

      - name: Generate coverage report
        run: gcovr --cobertura coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ !env.ACT && !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
