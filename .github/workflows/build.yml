name: build

on: [ push ]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang formatter
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find client common server -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: pip install conan

      - name: Detect profile
        run: conan profile detect --force

      - name: Audit dependencies
        env:
          CONAN_AUDIT_TOKEN: ${{ secrets.CONAN_AUDIT_TOKEN }}
        run: |
          conan audit provider auth conancenter --token="$CONAN_AUDIT_TOKEN"
          conan audit scan .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang linter
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Build
        uses: ./.github/actions/build
        with:
          cc: clang
          cxx: clang++
          opt: 3

      - name: Lint
        run: |
          find client common server -type f -name '*.cpp' -not -path '*/test/*' -print0 \
            | xargs -0 --no-run-if-empty clang-tidy -p cmake-build-release/build/Release

  test:
    name: ${{ matrix.compiler }} -O${{ matrix.opt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]
        opt: [ 0, 3 ]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/build
        with:
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          opt: ${{ matrix.opt }}

      - name: Test
        run: ctest --test-dir cmake-build-release/build/Release --output-on-failure
